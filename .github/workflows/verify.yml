name: verify
on:
  push:
  pull_request:
jobs:
  redaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Check for publication hazards
        run: ./scripts/check_public.sh
